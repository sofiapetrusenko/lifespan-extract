; pytest configuration.
;
; pytest.ini rather than pyproject.toml on purpose: ruff discovers its settings
; from pyproject.toml, and NOTES.md records that `ruff check .` must keep
; running with no config file so local and CI lint see identical rules.
;
; pythonpath is needed because `ingest` is a top-level package in the repo
; root, not an installed distribution; without it pytest's rootdir is not on
; sys.path and `import ingest` fails inside tests. `scripts` is on the path for
; the same reason: the gold-set tools there are standalone CLIs rather than a
; package, and their tests import them by module name.
[pytest]
pythonpath = . scripts
testpaths = tests
