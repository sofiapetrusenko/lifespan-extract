name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Validate gold set against schema
        run: python scripts/validate_gold.py

      # Structure, vocabulary and uniqueness only. The --resolve flag hits
      # PubMed and is deliberately not run here: a network call on every push
      # makes CI fail for reasons that have nothing to do with the change.
      - name: Validate classifier negative set
        run: python scripts/validate_classifier_set.py

      - name: Tests
        run: pytest

  # The protect_paths guard sat inert for weeks because an annotation needing
  # 3.10+ raised at import under 3.9, which PreToolUse reads as "hook errored,
  # proceed". The behavioural test for that finds an interpreter in
  # [3.9, 3.10) and skips when none exists — so on the 3.11 job above it never
  # runs. This job is the only place it does. The project itself stays 3.11;
  # only the guard and its tests are required to parse and run under 3.9.
  hook-guard-py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx

      - name: Hook guard tests under 3.9
        run: pytest tests/test_protect_paths.py