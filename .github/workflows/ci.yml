name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Validate gold set against schema
        run: python scripts/validate_gold.py

      # Structure, vocabulary and uniqueness only. The --resolve flag hits
      # PubMed and is deliberately not run here: a network call on every push
      # makes CI fail for reasons that have nothing to do with the change.
      - name: Validate classifier negative set
        run: python scripts/validate_classifier_set.py

      - name: Tests
        run: |
          # exit code 5 = no tests collected; acceptable until Phase 2
          pytest || [ $? -eq 5 ]
